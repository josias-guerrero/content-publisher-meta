  "components": {
    "securitySchemes": {
      "ServiceKey": {
        "type": "apiKey",
        "in": "header",
        "name": "X-API-Key"
      },
      "SignedContext": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Publisher-Context",
        "description": "base64url JSON + dot + HMAC(method newline pathQuery newline payload); see integration-tiko.md"
      }
    },
    "schemas": {
      "Object": {
        "type": "object",
        "additionalProperties": true
      },
      "Resource": {
        "type": "object",
        "required": [
          "id"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message",
              "retryable",
              "requestId"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "retryable": {
                "type": "boolean"
              },
              "requestId": {
                "type": "string"
              }
            }
          }
        },
        "example": {
          "error": {
            "code": "IDEMPOTENCY_CONFLICT",
            "message": "Key used for a different payload",
            "retryable": false,
            "requestId": "11111111-1111-4111-8111-111111111111"
          }
        }
      },
      "OAuthStart": {
        "type": "object",
        "required": [
          "platform"
        ],
        "properties": {
          "platform": {
            "enum": [
              "instagram",
              "facebook"
            ]
          }
        }
      },
      "OAuthSessionCreated": {
        "type": "object",
        "required": [
          "id",
          "authorizationUrl",
          "expiresAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "authorizationUrl": {
            "type": "string",
            "format": "uri"
          },
          "expiresAt": {
            "type": "integer",
            "description": "epoch seconds"
          }
        }
      },
      "OAuthSession": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "enum": [
              "pending",
              "succeeded",
              "denied",
              "expired",
              "failed"
            ]
          },
          "expiresAt": {
            "type": "integer"
          }
        }
      },
      "Selection": {
        "type": "object",
        "required": [
          "assetIds"
        ],
        "properties": {
          "assetIds": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "items": {
              "type": "string"
            }
          }
        }
      },
      "Assets": {
        "type": "object",
        "properties": {
          "assets": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string"
                },
                "name": {
                  "type": "string"
                },
                "accountType": {
                  "type": "string"
                },
                "tasks": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                }
              }
            }
          }
        }
      },
      "Capabilities": {
        "type": "object",
        "properties": {
          "formats": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "maxMedia": {
            "type": "integer"
          },
          "requiresPublicHttps": {
            "type": "boolean"
          },
          "diagnosticPublishes": {
            "const": false
          }
        }
      },
      "Account": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "platform": {
            "enum": [
              "instagram",
              "facebook"
            ]
          },
          "external_id": {
            "type": "string"
          },
          "name": {
            "type": [
              "string",
              "null"
            ]
          },
          "connection_id": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "enum": [
              "active",
              "reauth_required",
              "revoked",
              "disconnected"
            ]
          },
          "token_expires_at": {
            "type": [
              "integer",
              "null"
            ]
          },
          "capabilities": {
            "$ref": "#/components/schemas/Capabilities"
          }
        }
      },
      "Accounts": {
        "type": "object",
        "properties": {
          "accounts": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Account"
            }
          }
        }
      },
      "PostStatus": {
        "enum": [
          "pending",
          "publishing",
          "published",
          "failed",
          "cancelled",
          "reconciling"
        ]
      },
      "CreatePost": {
        "type": "object",
        "required": [
          "accountId",
          "mediaUrls",
          "scheduledAt"
        ],
        "properties": {
          "accountId": {
            "type": "string",
            "format": "uuid"
          },
          "caption": {
            "type": "string",
            "maxLength": 2200
          },
          "mediaUrls": {
            "type": "array",
            "minItems": 1,
            "maxItems": 10,
            "items": {
              "type": "string",
              "format": "uri"
            }
          },
          "type": {
            "enum": [
              "post",
              "reels",
              "story"
            ],
            "default": "post"
          },
          "scheduledAt": {
            "type": "integer",
            "description": "Future epoch seconds, at most 365 days"
          },
          "thumbOffset": {
            "type": "integer",
            "minimum": 0,
            "description": "Milliseconds; Instagram reel only"
          },
          "coverUrl": {
            "type": "string",
            "format": "uri"
          }
        },
        "example": {
          "accountId": "11111111-1111-4111-8111-111111111111",
          "mediaUrls": [
            "https://media.example.test/photo.jpg"
          ],
          "type": "post",
          "scheduledAt": 1800000000
        }
      },
      "Post": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "account_id": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "$ref": "#/components/schemas/PostStatus"
          },
          "media_urls": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "caption": {
            "type": [
              "string",
              "null"
            ]
          },
          "scheduled_at": {
            "type": "integer"
          },
          "created_at": {
            "type": "integer"
          },
          "updated_at": {
            "type": "integer"
          },
          "remote_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "remote_kind": {
            "type": [
              "string",
              "null"
            ]
          },
          "permalink": {
            "type": [
              "string",
              "null"
            ]
          },
          "error_code": {
            "type": [
              "string",
              "null"
            ]
          },
          "error_message": {
            "type": [
              "string",
              "null"
            ]
          },
          "retryable": {
            "type": "boolean"
          }
        }
      },
      "Posts": {
        "type": "object",
        "properties": {
          "posts": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Post"
            }
          }
        }
      },
      "SignedRequest": {
        "type": "object",
        "required": [
          "signed_request"
        ],
        "properties": {
          "signed_request": {
            "type": "string"
          }
        }
      },
      "DeletionConfirmation": {
        "type": "object",
        "required": [
          "url",
          "confirmation_code"
        ],
        "properties": {
          "url": {
            "type": "string",
            "format": "uri"
          },
          "confirmation_code": {
            "type": "string"
          }
        }
      },
      "DeletionStatus": {
        "type": "object",
        "properties": {
          "status": {
            "enum": [
              "pending",
              "processing",
              "completed",
              "failed"
            ]
          }
        }
      },
      "Connection": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "provider": {
            "enum": [
              "instagram",
              "facebook"
            ]
          },
          "login_mode": {
            "enum": [
              "instagram_login",
              "facebook_login"
            ]
          },
          "app_id": {
            "type": "string"
          },
          "status": {
            "enum": [
              "active",
              "reauth_required",
              "revoked",
              "disconnected"
            ]
          },
          "expires_at": {
            "type": [
              "integer",
              "null"
            ]
          },
          "created_at": {
            "type": "integer"
          },
          "updated_at": {
            "type": "integer"
          }
        }
      },
      "Connections": {
        "type": "object",
        "properties": {
          "connections": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/Connection"
            }
          }
        }
      },
      "Diagnostic": {
        "type": "object",
        "properties": {
          "platform": {
            "enum": [
              "instagram",
              "facebook"
            ]
          },
          "matched": {
            "type": "boolean"
          },
          "account_type": {
            "type": "string"
          },
          "published": {
            "const": false
          },
          "checks": {
            "type": "array",
            "items": {
              "const": "identity"
            }
          },
          "publishingPermissionVerified": {
            "const": false
          }
        }
      },
      "Metrics": {
        "type": "object",
        "properties": {
          "jobs": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "status": {
                  "$ref": "#/components/schemas/PostStatus"
                },
                "count": {
                  "type": "integer",
                  "minimum": 0
                }
              }
            }
          },
          "pendingEvents": {
            "type": "integer",
            "minimum": 0
          }
        }
      }
    },
    "responses": {
      "Error": {
        "description": "Stable application error",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    }
  }
}
